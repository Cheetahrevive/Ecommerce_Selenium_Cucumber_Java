name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chrome]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Run tests
      run: mvn clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true
    
    - name: Generate Test Report
      if: always()
      # report-only: generate from existing results without re-running tests
      # (plain `report` forks a second test run, without the CI flags)
      run: mvn surefire-report:report-only
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}
        path: |
          test-output/
          target/surefire-reports/
    
    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.browser }}
        path: test-output/screenshots/
    
    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results (${{ matrix.browser }})
        # TEST-*.xml only: testng-failed.xml is TestNG format, not JUnit,
        # and makes the reporter fail to parse the results
        path: target/surefire-reports/TEST-*.xml
        reporter: java-junit
