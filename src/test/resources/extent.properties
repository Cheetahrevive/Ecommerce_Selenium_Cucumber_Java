# Extent Report Configuration

# Report Theme - standard or dark
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# Report Title
extent.reporter.spark.config.documentTitle=E-Commerce Automation Test Report
extent.reporter.spark.config.reportName=E-Commerce Test Execution Report

# Report Theme
extent.reporter.spark.config.theme=standard

# Protocol
extent.reporter.spark.config.protocol=https

# Encoding
extent.reporter.spark.config.encoding=UTF-8

# JavaScript
extent.reporter.spark.config.js=

# CSS
extent.reporter.spark.config.css=

# Screenshots
extent.reporter.spark.config.offline=false

# Time Stamp Format
extent.reporter.spark.config.timeStampFormat=MMM dd, yyyy HH:mm:ss

# System Info
systeminfo.os=Windows
systeminfo.browser=Chrome
systeminfo.environment=Test
systeminfo.buildnumber=1.0.0
