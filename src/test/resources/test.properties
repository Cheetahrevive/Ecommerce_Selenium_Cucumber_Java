# Test Configuration Properties

# Application URLs
baseUrl=https://www.example-ecommerce.com
baseUrl.qa=https://qa.example-ecommerce.com
baseUrl.staging=https://staging.example-ecommerce.com
baseUrl.prod=https://www.example-ecommerce.com

# Browser Configuration
browser=chrome
headless=false
maximize=true

# Timeout Configuration (in seconds)
implicit.wait=10
explicit.wait=30
page.load.timeout=30

# Test Data
test.user.email=test@example.com
test.user.password=Test@123
test.admin.email=admin@example.com
test.admin.password=Admin@123

# API Configuration
api.base.url=https://api.example-ecommerce.com
api.timeout=30000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.on.pass=false
screenshot.directory=target/screenshots

# Report Configuration
report.directory=target/cucumber-reports
report.title=E-Commerce Automation Test Report
report.theme=standard

# Retry Configuration
max.retry.count=2

# Database Configuration (Optional)
db.url=jdbc:mysql://localhost:3306/ecommerce_db
db.username=test_user
db.password=test_password

# Email Configuration (Optional)
email.notifications=false
email.recipients=qa-team@example.com

# Logging Configuration
log.level=INFO

# Environment
environment=qa
